services:
    db:
        image: postgres:16-alpine
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${POSTGRES_DB}
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        ports:
            - "127.0.0.1:5433:5432"
        volumes:
            - pgdata:/var/lib/postgresql/data
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
                ]
            interval: 10s
            timeout: 5s
            retries: 5

    redis:
        image: redis:7-alpine
        restart: unless-stopped
        command: redis-server --appendonly yes
        volumes:
            - redisdata:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5

    celery:
        build: .
        restart: unless-stopped
        command: celery -A config worker -l info
        env_file: .env
        environment:
            REDIS_URL: redis://redis:6379/0
            CELERY_BROKER_URL: redis://redis:6379/0
            DB_HOST: db
            DB_PORT: 5432
        volumes:
            - ./media:/app/media
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy

    celery-beat:
        build: .
        restart: unless-stopped
        command: celery -A config beat -l info
        env_file: .env
        environment:
            REDIS_URL: redis://redis:6379/0
            CELERY_BROKER_URL: redis://redis:6379/0
            DB_HOST: db
            DB_PORT: 5432
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy

    web:
        build: .
        restart: unless-stopped
        env_file: .env
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy
        volumes:
            - ./media:/app/media
        ports:
            - "127.0.0.1:8000:8000"
        environment:
            REDIS_URL: redis://redis:6379/0
            CELERY_BROKER_URL: redis://redis:6379/0
            DB_HOST: db
            DB_PORT: 5432

volumes:
    pgdata:
    redisdata:
